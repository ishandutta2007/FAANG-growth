<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <style>
      .line {
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw 4s ease-in-out infinite alternate;
      }
      .meta { stroke: #1877F2; animation-delay: 0s; }
      .amazon { stroke: #FF9900; animation-delay: 0.2s; }
      .apple { stroke: #888888; animation-delay: 0.4s; }
      .netflix { stroke: #E50914; animation-delay: 0.6s; }
      .alphabet { stroke: #34A853; animation-delay: 0.8s; }
      .microsoft { stroke: #00A4EF; animation-delay: 1.0s; }
      
      @keyframes draw {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      
      .title {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 42px;
        font-weight: 800;
        fill: #f8fafc;
        text-anchor: middle;
      }
      
      .subtitle {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 16px;
        font-weight: 600;
        fill: #94a3b8;
        text-anchor: middle;
        letter-spacing: 4px;
      }

      .floating {
        animation: float 6s ease-in-out infinite;
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
    </style>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)" rx="15"/>
  
  <g opacity="0.3">
    <!-- Abstract trendlines -->
    <path class="line meta" d="M -50,150 Q 150,50 350,120 T 850,70" />
    <path class="line amazon" d="M -50,180 Q 200,90 400,160 T 850,100" />
    <path class="line alphabet" d="M -50,120 Q 250,140 450,80 T 850,130" />
    <path class="line netflix" d="M -50,200 Q 300,100 500,180 T 850,110" />
    <path class="line microsoft" d="M -50,100 Q 100,180 300,140 T 850,60" />
  </g>
  
  <g class="floating">
    <text x="400" y="105" class="title">FAANG + M Growth</text>
    <text x="400" y="140" class="subtitle">ENGINEERING HEADCOUNT TRENDS</text>
  </g>
</svg>
